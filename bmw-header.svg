<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="50%" stop-color="#0a0f18"/>
      <stop offset="100%" stop-color="#06080e"/>
    </linearGradient>

    <!-- BMW M Stripes Gradients -->
    <linearGradient id="mLightBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066B1"/>
      <stop offset="100%" stop-color="#00A3E0"/>
    </linearGradient>
    <linearGradient id="mDarkBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#001E50"/>
      <stop offset="100%" stop-color="#0a2f77"/>
    </linearGradient>
    <linearGradient id="mRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0001B"/>
      <stop offset="100%" stop-color="#FF2A45"/>
    </linearGradient>

    <!-- Chrome Rim Gradients -->
    <linearGradient id="chromeBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="30%" stop-color="#9aa0ac"/>
      <stop offset="70%" stop-color="#4a5260"/>
      <stop offset="100%" stop-color="#d4dce8"/>
    </linearGradient>

    <!-- Glowing Angel Eyes Filter -->
    <filter id="neonGlowBlue" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="laserBeamGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseAngelEyes {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 8px #00a3e0); }
      50% { opacity: 1; filter: drop-shadow(0 0 18px #00d2ff) drop-shadow(0 0 35px #0066b1); }
    }
    @keyframes speedFlow {
      0% { stroke-dashoffset: 600; opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { stroke-dashoffset: -600; opacity: 0.2; }
    }
    @keyframes emblemShine {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-3px) rotate(0.5deg); }
    }
    @keyframes sweepLight {
      0% { transform: translateX(-150px); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translateX(950px); opacity: 0; }
    }
    .angel-eye {
      animation: pulseAngelEyes 3s ease-in-out infinite;
    }
    .speed-line {
      stroke-dasharray: 120 180;
      animation: speedFlow 4s linear infinite;
    }
    .emblem-group {
      animation: emblemShine 5s ease-in-out infinite;
      transform-origin: 150px 140px;
    }
    .scanner-beam {
      animation: sweepLight 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Space Grotesk', Roboto, sans-serif;
      font-weight: 800;
      letter-spacing: 2px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace;
      letter-spacing: 3px;
      font-weight: 600;
    }
  </style>

  <!-- Card Frame -->
  <rect x="2" y="2" width="896" height="276" rx="16" fill="url(#bgGrad)" stroke="#1a2335" stroke-width="2"/>

  <!-- Cyber 3D Speed Grid Lines in Perspective -->
  <g stroke="#0f192b" stroke-width="1" opacity="0.6">
    <line x1="0" y1="230" x2="900" y2="230"/>
    <line x1="0" y1="250" x2="900" y2="250"/>
    <line x1="0" y1="265" x2="900" y2="265"/>
    <line x1="0" y1="275" x2="900" y2="275"/>

    <line x1="100" y1="210" x2="30" y2="280"/>
    <line x1="250" y1="210" x2="200" y2="280"/>
    <line x1="400" y1="210" x2="380" y2="280"/>
    <line x1="550" y1="210" x2="560" y2="280"/>
    <line x1="700" y1="210" x2="730" y2="280"/>
    <line x1="850" y1="210" x2="890" y2="280"/>
  </g>

  <!-- Laser Speed Trails (Animated) -->
  <line x1="280" y1="95" x2="870" y2="95" stroke="url(#mLightBlue)" stroke-width="2" class="speed-line" filter="url(#laserBeamGlow)"/>
  <line x1="280" y1="100" x2="870" y2="100" stroke="url(#mDarkBlue)" stroke-width="2" class="speed-line" style="animation-delay: -1.3s;"/>
  <line x1="280" y1="105" x2="870" y2="105" stroke="url(#mRed)" stroke-width="2" class="speed-line" style="animation-delay: -2.6s;"/>

  <!-- Top M Heritage Accent Tri-Bar -->
  <g transform="translate(680, 24)">
    <polygon points="0,0 22,-14 36,-14 14,0" fill="url(#mLightBlue)" />
    <polygon points="17,0 39,-14 53,-14 31,0" fill="url(#mDarkBlue)" />
    <polygon points="34,0 56,-14 70,-14 48,0" fill="url(#mRed)" />
    <text x="80" y="-3" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="14" letter-spacing="1.5">POWER</text>
  </g>

  <!-- Left Side: 3D BMW Emblem & Angel Eyes Concept -->
  <g class="emblem-group">
    <!-- Outer Glow -->
    <circle cx="140" cy="140" r="82" fill="none" stroke="#0066b1" stroke-width="2" opacity="0.4" filter="url(#neonGlowBlue)"/>

    <!-- BMW Outer Chrome Rim -->
    <circle cx="140" cy="140" r="74" fill="#0d1118" stroke="url(#chromeBevel)" stroke-width="4.5"/>
    <circle cx="140" cy="140" r="67" fill="#06080e" stroke="#1f2533" stroke-width="1.5"/>

    <!-- BMW Letters -->
    <text x="110" y="98" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="900" font-size="16">B</text>
    <text x="133" y="90" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="900" font-size="16">M</text>
    <text x="157" y="98" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="900" font-size="16">W</text>

    <!-- Inner Chrome Ring -->
    <circle cx="140" cy="140" r="45" fill="none" stroke="url(#chromeBevel)" stroke-width="3"/>

    <!-- Quadrants (Blue & White) -->
    <g transform="translate(140, 140)">
      <!-- Top-Left Cyan -->
      <path d="M 0 0 L 0 -45 A 45 45 0 0 0 -45 0 Z" fill="#0066b1"/>
      <!-- Top-Right White -->
      <path d="M 0 0 L 45 0 A 45 45 0 0 0 0 -45 Z" fill="#f0f4fa"/>
      <!-- Bottom-Right Cyan -->
      <path d="M 0 0 L 0 45 A 45 45 0 0 0 45 0 Z" fill="#0066b1"/>
      <!-- Bottom-Left White -->
      <path d="M 0 0 L -45 0 A 45 45 0 0 0 0 45 Z" fill="#f0f4fa"/>
      <!-- Crosshairs -->
      <line x1="0" y1="-45" x2="0" y2="45" stroke="#121620" stroke-width="2"/>
      <line x1="-45" y1="0" x2="45" y2="0" stroke="#121620" stroke-width="2"/>
      <!-- Chrome 3D Specular Highlight Glass -->
      <path d="M -38 -15 A 42 42 0 0 1 38 -15 A 42 22 0 0 0 -38 -15 Z" fill="rgba(255,255,255,0.35)"/>
    </g>

    <!-- Twin BMW Iconic LED Halo Rings (Angel Eyes) -->
    <g class="angel-eye" stroke="#00d2ff" stroke-width="2.5" fill="none" opacity="0.9">
      <!-- Left Halo -->
      <path d="M 45 155 A 18 18 0 1 1 78 155" stroke-linecap="round"/>
      <circle cx="61.5" cy="145" r="3.5" fill="#ffffff"/>
      <!-- Right Halo -->
      <path d="M 202 155 A 18 18 0 1 1 235 155" stroke-linecap="round"/>
      <circle cx="218.5" cy="145" r="3.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Right Side: Clean Typography & Driver Identity -->
  <g transform="translate(280, 55)">
    <!-- Subtitle badge -->
    <rect x="0" y="0" width="220" height="24" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#0066b1" />
    <circle cx="12" cy="12" r="2" fill="#00d2ff" />
    <text x="24" y="16" fill="#88a0c5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1.5">M ENGINEERING LAB</text>

    <!-- Main Title -->
    <text x="0" y="65" fill="#ffffff" class="title-text" font-size="34">SHREE HARI S B</text>

    <!-- Dynamic Tagline -->
    <text x="0" y="98" fill="#00d2ff" class="sub-text" font-size="13">COMPUTER SCIENCE ENGINEER • AI &amp; VISION ARCHITECT</text>

    <!-- Tech Badges Minimalist Pills -->
    <g transform="translate(0, 125)">
      <!-- Pill 1: Python / AI -->
      <rect x="0" y="0" width="105" height="26" rx="6" fill="#0c121e" stroke="#0066b1" stroke-width="1.2"/>
      <text x="12" y="17" fill="#d4e5ff" font-family="sans-serif" font-size="11" font-weight="700">PYTHON &bull; AI</text>

      <!-- Pill 2: MediaPipe / OpenCV -->
      <rect x="115" y="0" width="145" height="26" rx="6" fill="#0c121e" stroke="#001E50" stroke-width="1.2"/>
      <text x="127" y="17" fill="#d4e5ff" font-family="sans-serif" font-size="11" font-weight="700">COMPUTER VISION</text>

      <!-- Pill 3: WebGL / 3D -->
      <rect x="270" y="0" width="125" height="26" rx="6" fill="#0c121e" stroke="#E0001B" stroke-width="1.2"/>
      <text x="282" y="17" fill="#ffccd2" font-family="sans-serif" font-size="11" font-weight="700">3D WEBGL DRIVE</text>

      <!-- Pill 4: Render / Cloud -->
      <rect x="405" y="0" width="135" height="26" rx="6" fill="#0c121e" stroke="#46E3B7" stroke-width="1.2"/>
      <text x="417" y="17" fill="#c3fae8" font-family="sans-serif" font-size="11" font-weight="700">CLOUD DEPLOYED</text>
    </g>

    <!-- Interactive Drive Prompt -->
    <g transform="translate(0, 175)">
      <text x="0" y="15" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="13">
        Experience the Virtual BMW 3D Road Tour:
      </text>
      <text x="290" y="15" fill="#00d2ff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800">
        shreehari.onrender.com &rarr;
      </text>
    </g>
  </g>

  <!-- Sweeping Metallic Laser Shimmer Effect -->
  <g class="scanner-beam">
    <line x1="0" y1="0" x2="50" y2="280" stroke="rgba(255,255,255,0.15)" stroke-width="3" filter="url(#laserBeamGlow)"/>
  </g>
</svg>